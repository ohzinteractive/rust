<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141613">
  <meta name="description" content="An interactive study of rust. Explore noise-driven oxidation, mineral color, and peeling layers on a Three.js cube.">
  <title>OXIDE — A study in impermanence</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141613'/%3E%3Cpath d='M32 9 52 21v23L32 56 12 44V21Z' fill='none' stroke='%23ef8a43' stroke-width='5'/%3E%3Cpath d='m12 21 20 12 20-12M32 33v23' fill='none' stroke='%23ef8a43' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"></path></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3c5 0 7 12 12 12h3M17 14l4 4-4 4M3 18h3c2 0 4-3 6-6s4-6 6-6h3M17 2l4 4-4 4"></path></symbol>
    <symbol id="i-orbit" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="11" ry="4.6" transform="rotate(-33 12 12)"></ellipse><circle cx="12" cy="12" r="4"></circle></symbol>
  </defs></svg>


  <main class="workspace">
    <section class="stage" aria-label="Interactive three-dimensional corroding metal cube">
      <nav class="project-credits" aria-label="Project links">
        <a href="https://github.com/tinotibaldo/rust" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        <span>Made by <a href="https://ohzi.io" target="_blank" rel="noopener noreferrer">ohzi.io</a></span>
      </nav>
      <button id="settings-toggle" class="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel">Settings</button>
      <div class="view-mode" role="group" aria-label="Material view">
        <button id="surface-view" class="selected" aria-pressed="true">Surface</button>
        <button id="layers-view" aria-pressed="false">Layers</button>
      </div>
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="scene" aria-label="Yellow painted cube gradually rusting and shedding flakes onto the ground. Drag to orbit, scroll to zoom, or use the arrow keys to rotate." tabindex="0"></canvas>
      </div>
      
      <div class="loading" id="loading" role="status"><div class="loader-ring" aria-hidden="true"></div><span>Preparing the specimen…</span></div>
      <div class="webgl-error" id="webgl-error" hidden=""><h2>This specimen needs WebGL 2.</h2><p>Try a current browser with hardware acceleration enabled.</p><button id="retry">Try again</button></div>
      <div class="specimen-label"><span class="label-line"></span><span><span id="metal-symbol">Fe</span><span class="specimen-sub"><span id="metal-name">IRON</span> / SPECIMEN <span id="specimen-number">073</span></span></span></div>
      <div class="stage-tools">
        <div class="tool-buttons"><button id="rotate" class="icon-button active" aria-label="Pause automatic rotation" aria-pressed="true" title="Auto rotate"><svg><use href="#i-orbit"></use></svg></button><button id="reset-view" class="icon-button" aria-label="Reset camera view" title="Reset view"><svg><use href="#i-reset"></use></svg></button></div>
      </div>
      <div class="specimen-dock">
      <div class="exposure-dock">
        <div class="exposure-top"><label for="age">EXPOSURE</label><div class="phase"><span id="phase-dot"></span><span id="phase">Fresh paint</span></div><div class="exposure-playback"><button id="age-play" type="button" aria-label="Pause aging" title="Pause aging"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="age-play-icon" d="M8 5v14M16 5v14"></path></svg></button><select id="age-speed" aria-label="Aging speed"><option value="1">1×</option><option value="2">2×</option><option value="5">5×</option><option value="10" selected>10×</option><option value="20">20×</option></select><output id="age-value" for="age">00<span>%</span></output></div></div>
        <input id="age" class="age-range" type="range" min="0" max="100" step="0.1" value="0" aria-label="Exposure age" style="--fill: 0%;">
        <div class="age-labels"><button data-age="0" class="active">Fresh paint</button><button data-age="32">First bloom</button><button data-age="64">Layer breakdown</button><button data-age="100">Timeworn</button></div>
      </div>
      <div class="material-picker" role="group" aria-label="Specimen appearance">
        <div class="picker-row" role="group" aria-label="Choose metal">
        <button class="material-swatch selected" data-metal="iron" aria-pressed="true" aria-label="Iron"><span class="metal-sample iron" aria-hidden="true"></span><span>Iron</span></button>
        <button class="material-swatch" data-metal="copper" aria-pressed="false" aria-label="Copper"><span class="metal-sample copper" aria-hidden="true"></span><span>Copper</span></button>
        <button class="material-swatch" data-metal="bronze" aria-pressed="false" aria-label="Bronze"><span class="metal-sample bronze" aria-hidden="true"></span><span>Bronze</span></button>
        <button class="material-swatch" data-metal="aluminum" aria-pressed="false" aria-label="Aluminum"><span class="metal-sample aluminum" aria-hidden="true"></span><span>Aluminum</span></button>
        <button id="paint-toggle" class="material-swatch paint-bucket selected" aria-label="Paint options" aria-expanded="false" aria-controls="paint-options" title="Choose paint colour">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 7-7 9 9-7 7a2 2 0 0 1-3 0l-6-6a2 2 0 0 1 0-3Z"/><path d="M6 8 4 6a2 2 0 0 1 3-3l5 5M4 12h16"/><path d="M20 16s-2 2.4-2 3.5a2 2 0 0 0 4 0C22 18.4 20 16 20 16Z" fill="currentColor" stroke="none"/></svg>
          <span>Paint</span>
        </button>
        </div>
        <div id="paint-options" class="paint-options" role="group" aria-label="Paint options" hidden>
          <label class="paint-enabled"><input id="paint-enabled" type="checkbox" checked> Painted surface</label>
          <label class="paint-colour" for="picker-paint-color"><span>Paint colour</span><input id="picker-paint-color" type="color" value="#efc51a"></label>
        </div>
        <div class="picker-row shape-row" role="group" aria-label="Choose shape">
          <button type="button" class="material-swatch shape-swatch selected" data-shape="cube" aria-pressed="true" aria-label="Cube shape"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7Zm-9 5 9 5 9-5M12 12v10"/></svg><span>Cube</span></button>
          <button type="button" class="material-swatch shape-swatch" data-shape="cone" aria-pressed="false" aria-label="Cone shape"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 19 9-17 9 17"/><ellipse cx="12" cy="19" rx="9" ry="3"/></svg><span>Cone</span></button>
          <button type="button" class="material-swatch shape-swatch" data-shape="sphere" aria-pressed="false" aria-label="Sphere shape"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4" ry="10"/><path d="M2 12h20"/></svg><span>Sphere</span></button>
          <button type="button" class="material-swatch shape-swatch" data-shape="plus" aria-pressed="false" aria-label="Plus shape"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h8v6h6v8h-6v6H8v-6H2V8h6Z"/></svg><span>Plus</span></button>
          <button type="button" class="material-swatch shape-swatch" data-shape="pill" aria-pressed="false" aria-label="Pill shape"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="6" transform="rotate(30 12 12)"/></svg><span>Pill</span></button>
          <button type="button" id="random-shape" class="material-swatch shape-swatch" aria-label="Randomize specimen" title="New shape, material, paint and colours"><svg aria-hidden="true"><use href="#i-shuffle"></use></svg><span>Random</span></button>
        </div>
      </div>
      </div>
    </section>

    <aside id="settings-panel" class="control-panel" aria-label="Simulation controls" hidden>
      <button id="settings-close" class="settings-close" type="button" aria-label="Close settings">Close ×</button>

      <button class="repaint-button" id="restart"><svg><use href="#i-reset"></use></svg>Repaint &amp; restart</button>


      <div class="control compact"><div class="control-label"><label for="scale">Noise scale</label><output for="scale" id="scale-value">2.4<span>×</span></output></div><input type="range" id="scale" min="0.8" max="5" value="2.4" step="0.1" style="--fill: 38.095238095238095%;"></div>
      <div class="control compact"><div class="control-label"><label for="peel">Peeling</label><output for="peel" id="peel-value">68<span>%</span></output></div><input type="range" id="peel" min="0" max="100" value="68" style="--fill: 68%;"></div>
      <div class="control compact"><div class="control-label"><label for="relief">Surface relief</label><output for="relief" id="relief-value">100<span>%</span></output></div><input type="range" id="relief" min="0" max="100" value="100" style="--fill: 100%;"></div>

      <div class="palette-heading"><h3>Colour study</h3><span id="palette-name">Yellow / painted</span></div>
      <div class="palette-options" role="group" aria-label="Color palette">
        <button class="palette selected" data-palette="yellow" aria-label="Yellow paint palette: yellow, rust and muted green" aria-pressed="true"><span style="--swatch:#efc51a"></span><span style="--swatch:#b95b28"></span><span style="--swatch:#53645a"></span><span class="palette-check">✓</span></button>
        <button class="palette" data-palette="oxide" aria-label="Oxide palette: rust, muted green and ochre" aria-pressed="false"><span style="--swatch:#af5129"></span><span style="--swatch:#5b6554"></span><span style="--swatch:#b99a56"></span><span class="palette-check">✓</span></button>
        <button class="palette" data-palette="ember" aria-label="Ember palette: amber, terracotta and charcoal" aria-pressed="false"><span style="--swatch:#c46430"></span><span style="--swatch:#785846"></span><span style="--swatch:#554e43"></span><span class="palette-check">✓</span></button>
        <button class="palette" data-palette="tidal" aria-label="Tidal palette: rust, cool green and ivory" aria-pressed="false"><span style="--swatch:#b36b39"></span><span style="--swatch:#6b8580"></span><span style="--swatch:#e3d8bd"></span><span class="palette-check">✓</span></button>
      </div>
      <div class="individual-colors" role="group" aria-label="Independent material colors">
        <label class="color-control" for="color-paint"><input id="color-paint" type="color" value="#efc51a" aria-label="Topcoat paint color"><span>Paint<small id="hex-paint">#EFC51A</small></span></label>
        <label class="color-control" for="color-undercoat"><input id="color-undercoat" type="color" value="#53645a" aria-label="Undercoat color"><span>Undercoat<small id="hex-undercoat">#53645A</small></span></label>
        <label class="color-control" for="color-rust"><input id="color-rust" type="color" value="#b95b28" aria-label="Corrosion color"><span><span id="corrosion-label">Rust</span><small id="hex-rust">#B95B28</small></span></label>
        <label class="color-control" for="color-oxide"><input id="color-oxide" type="color" value="#70371f" aria-label="Dark oxide color"><span>Dark deposits<small id="hex-oxide">#70371F</small></span></label>
        <label class="color-control" for="color-metal"><input id="color-metal" type="color" value="#343936" aria-label="Exposed metal color"><span>Metal<small id="hex-metal">#343936</small></span></label>
      </div>
      <button class="new-specimen" id="new-specimen"><svg><use href="#i-shuffle"></use></svg>New specimen<span id="seed-value">SEED 07319</span></button>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>


</body></html>
